syntax = "proto3";

package verteilen2;

import "dynamic_map.proto";

// MsgType: DEBUG_LOG
message Job {
    string uuid = 1;
    string name = 2;
    int32 type = 3;
    string script = 4;
    DynamicMap d_map = 5;
    string inputs_0 = 6;
    string inputs_1 = 7;
    string inputs_2 = 8;
    string inputs_3 = 9;
    string inputs_4 = 10;
}