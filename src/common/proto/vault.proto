syntax = "proto3";

package verteilen2;

message Vault {
    string uuid = 1;
    string name = 2;
    map<string, bool> data_bool = 3;
    map<string, int32> data_int32 = 4;
    map<string, int64> data_int64 = 5;
    map<string, float> data_float = 6;
    map<string, double> data_double = 7;
    map<string, string> data_string = 8;
}