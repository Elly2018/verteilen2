syntax = "proto3";

package verteilen2;

enum SyncType {
    SyncType_NONE = 0;
    SyncType_CREATE = 1;
    SyncType_MODIFY = 2;
    SyncType_DELETE = 4;
}

// MsgType: DEBUG_LOG
message FileSystemRule {
    string uuid = 1;
    string target_uuid = 2;
    string filename = 3;
    SyncType type = 4;
}